<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .logo {
      width: 80px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0;
      color: #1e3a8a;
      font-size: 20px;
    }

    .tagline {
      color: #3b82f6;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1e40af;
    }

    .forgot {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Logo (replace with your image if needed) -->
    <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png" class="logo" alt="logo" />

    <h2>E-learning UCC</h2>
    <div class="tagline">INNOVATE | SECURE | CONNECT</div>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />

      <button type="submit">Log in</button>
    </form>

    <a href="#" class="forgot">Lost password?</a>
  </div>

    <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Simple validation
      if (username === "PS/ABC/24/0134" && password === "12345678") {
        // Redirect to homepage.html
        window.location.href = "hompage.html"; 
      } else {
        alert("Invalid credentials. Please try again.");
      }
    });
  </script>
  

</body>

</html>
